version: '3.7'

services:
  postgres:
    image: postgres:16.3
    ports:
      - '8090:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nazdrovia
      POSTGRES_PASSWORD: "R3FKy5K7JzOIxCs6rghxpo9-KVfzQXGv"
    volumes:
      - nazdrovia_data:/var/lib/postgresql/data
  redis:
    image: redis:6.2.6
    ports:
      - '8091:6379'
    command: redis-server --requirepass "50KuB2U9-EY9cGBlBnJm-TgT-THM8UwY"
    environment:
      - REDIS_REPLICATION_MODE=master
volumes:
  nazdrovia_data:
